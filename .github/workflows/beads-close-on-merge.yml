name: Beads close on merge

# Fires whenever a pull request is closed. We only act when it was actually
# MERGED (not just closed), and only when the branch follows the bead/<id>-...
# naming convention that /bd-go produces.
on:
  pull_request:
    types: [closed]

# Stage 1: detect the merge, extract the bead id, and report what we WOULD
# close. No beads mutation yet — this is the safe, learn-the-ropes version.
jobs:
  report-bead:
    # Only run for merged PRs. A PR closed without merging is ignored.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    # We comment on the PR, so we need write access to issues/PRs.
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Extract bead id from branch name
        id: bead
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Merged branch: $HEAD_BRANCH"
          # Match an id like totally-716.1.3 anywhere in the branch name.
          BEAD_ID=$(echo "$HEAD_BRANCH" | grep -oE '[a-z0-9]+-[0-9]+(\.[0-9]+)*' | head -1 || true)
          if [ -z "$BEAD_ID" ]; then
            echo "No bead id found in branch name; nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found bead id: $BEAD_ID"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "id=$BEAD_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment what would be closed
        if: steps.bead.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEAD_ID: ${{ steps.bead.outputs.id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Stage 1 (dry run): this merge WOULD close bead \`$BEAD_ID\` and run \`bd dolt push\`. No beads state was changed yet."
