name: Beads close on merge

# Fires whenever a pull request is closed. We only act when it was actually
# MERGED (not just closed), and only when the branch follows the bead/<id>-...
# naming convention that /bd-go produces.
on:
  pull_request:
    types: [closed]

# Stage 2: on merge, extract the bead id, then actually close the bead and
# push the updated beads state back to refs/dolt/data.
#
# Auth model: sync.remote is git+https://github.com/<owner>/<repo>.git, so
# `bd dolt push` shells out to git. We authenticate git with the built-in
# GITHUB_TOKEN via url.insteadOf, so the Dolt-over-git push is authorized.
jobs:
  close-bead:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    # contents:write so the token may push refs/dolt/data; PR write for the comment.
    permissions:
      contents: write
      pull-requests: write

    env:
      # Pin to match (or lead) the local bd version; bump deliberately.
      BD_VERSION: "1.3.0"

    steps:
      - name: Extract bead id from branch name
        id: bead
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Merged branch: $HEAD_BRANCH"
          # Bead ids look like <prefix>-<alnum>(.<num>)* e.g. totally-716.1.3 or totally-hv6.
          BEAD_ID=$(echo "$HEAD_BRANCH" | grep -oE '[a-z0-9]+-[a-z0-9]+(\.[0-9]+)*' | head -1 || true)
          if [ -z "$BEAD_ID" ]; then
            echo "No bead id in branch name; nothing to close."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found bead id: $BEAD_ID"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "id=$BEAD_ID" >> "$GITHUB_OUTPUT"
          fi

      # Check out the repo so .beads/config.yaml (sync.remote) is present.
      - name: Checkout
        if: steps.bead.outputs.found == 'true'
        uses: actions/checkout@v4

      # Authenticate any https://github.com/... git operation (incl. bd dolt
      # push/pull) using the runner's GITHUB_TOKEN.
      - name: Configure git auth for Dolt-over-git
        if: steps.bead.outputs.found == 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "beads-bot"
          git config --global user.email "beads-bot@users.noreply.github.com"

      - name: Install bd
        if: steps.bead.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${BD_VERSION}" --repo gastownhall/beads \
            --pattern "beads_${BD_VERSION}_linux_amd64.tar.gz" --output /tmp/bd.tar.gz
          tar -xzf /tmp/bd.tar.gz -C /tmp
          # Move the bd binary onto PATH.
          BD_BIN=$(find /tmp -maxdepth 2 -name bd -type f | head -1)
          sudo install -m 0755 "$BD_BIN" /usr/local/bin/bd
          bd version

      # Hydrate the Dolt DB from refs/dolt/data (the git checkout does NOT
      # contain the embedded Dolt data; it must be pulled).
      - name: Hydrate beads Dolt state
        if: steps.bead.outputs.found == 'true'
        run: bd dolt pull

      - name: Close bead and push
        id: close
        if: steps.bead.outputs.found == 'true'
        env:
          BEAD_ID: ${{ steps.bead.outputs.id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          bd close "$BEAD_ID" --reason="Merged via PR: $PR_URL"
          bd dolt push

      - name: Comment success
        if: steps.bead.outputs.found == 'true' && steps.close.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEAD_ID: ${{ steps.bead.outputs.id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Closed bead \`$BEAD_ID\` and pushed beads state to \`refs/dolt/data\`."

      - name: Comment failure
        if: steps.bead.outputs.found == 'true' && steps.close.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEAD_ID: ${{ steps.bead.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Failed to close bead \`$BEAD_ID\` / push beads state. Check the run: $RUN_URL — the bead is still open and must be closed manually."
